name: CI

# Gates every push and PR (PLAN §4, M1). Deploys stay in deploy.yml (GitHub Pages)
# until the Cloudflare Pages projects exist.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No sync:github here: CI checks the committed github-repos.generated.json,
      # so a run never depends on the GitHub API.
      - name: Type-check (tsc)
        run: bunx tsc --noEmit

      - name: Astro check
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Build (+ dist/_headers)
        run: bun run build

      - name: Bundle budgets
        run: bun run budgets

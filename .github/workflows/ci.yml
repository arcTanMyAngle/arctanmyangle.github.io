name: CI

# Gates every push and PR (PLAN §4, M1), then deploys origin A to Cloudflare Pages.
# deploy.yml keeps GitHub Pages live until the M6 cut-over.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      alias: ${{ steps.build.outputs.alias }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No sync:github here: CI checks the committed github-repos.generated.json,
      # so a run never depends on the GitHub API.
      - name: Type-check (tsc)
        run: bunx tsc --noEmit

      - name: Astro check
        run: bun run check

      - name: Unit tests
        run: bun test

      # A branch preview of A must frame the same branch's preview of G, not production G. Pages adds a random suffix
      # to the alias of any branch name it has to clean up (e.g. one with a "/"), so both deploys pass an
      # already-clean name: lowercase, anything else turned into "-", 28 characters. That alias is then predictable.
      - name: Build (+ dist/_headers)
        id: build
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          alias=main
          if [ "$BRANCH" != "main" ]; then
            alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-28 | sed -E 's/^-+|-+$//g')
            export PUBLIC_PLAY_ORIGIN="https://$alias.arctanmyangle-play.pages.dev"
            echo "Framing games from $PUBLIC_PLAY_ORIGIN"
          fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          bun run build

      - name: Bundle budgets
        run: bun run budgets

      # T-M1-04: axe (0 serious/critical) plus shell, focus-order and phone-menu checks on every sitemap route,
      # served from dist/ with its real _headers CSP. Runs before the upload, so deploy is gated on it too.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end and accessibility
        run: bun run e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Keep the verified build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1

  # D-19: origin A is a direct-upload Pages project, deployed only from a build that
  # passed every gate above. main is production; any other branch is a preview at
  # <branch>.arctanmyangle.pages.dev. The token lives only in this job, so dependency
  # install scripts never see it. Skipped until the repo has the secrets.
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Get the verified build
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Bun
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Origin G (D-19) is plain files, so it deploys straight from the repo. It goes first so A never frames a game
      # that G doesn't have yet.
      - name: Get origin G's files
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
        with:
          sparse-checkout: play
          path: src-g

      - name: Deploy to Cloudflare Pages (origin G)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          BRANCH: ${{ needs.verify.outputs.alias }}
        run: >-
          bunx wrangler@4.151.1 pages deploy src-g/play
          --project-name arctanmyangle-play
          --branch "$BRANCH"
          --commit-hash "$GITHUB_SHA"
          --commit-message "$GITHUB_SHA"

      - name: Deploy to Cloudflare Pages (origin A)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          BRANCH: ${{ needs.verify.outputs.alias }}
        run: >-
          bunx wrangler@4.151.1 pages deploy dist
          --project-name arctanmyangle
          --branch "$BRANCH"
          --commit-hash "$GITHUB_SHA"
          --commit-message "$GITHUB_SHA"

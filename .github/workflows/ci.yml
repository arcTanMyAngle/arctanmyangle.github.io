name: CI

# Gates every push and PR (PLAN §4, M1), then deploys origin A to Cloudflare Pages.
# deploy.yml keeps GitHub Pages live until the M6 cut-over.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No sync:github here: CI checks the committed github-repos.generated.json,
      # so a run never depends on the GitHub API.
      - name: Type-check (tsc)
        run: bunx tsc --noEmit

      - name: Astro check
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Build (+ dist/_headers)
        run: bun run build

      - name: Bundle budgets
        run: bun run budgets

      - name: Keep the verified build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1

  # D-19: origin A is a direct-upload Pages project, deployed only from a build that
  # passed every gate above. main is production; any other branch is a preview at
  # <branch>.arctanmyangle.pages.dev. The token lives only in this job, so dependency
  # install scripts never see it. Skipped until the repo has the secrets.
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Get the verified build
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Bun
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Deploy to Cloudflare Pages (origin A)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          BRANCH: ${{ github.ref_name }}
        run: >-
          bunx wrangler@4.151.1 pages deploy dist
          --project-name arctanmyangle
          --branch "$BRANCH"
          --commit-hash "$GITHUB_SHA"
          --commit-message "$GITHUB_SHA"
